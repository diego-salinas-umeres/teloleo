name: Publicar la política de privacidad

on:
  push:
    branches: [main]
    paths:
      - "privacy/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir la página
        uses: actions/upload-pages-artifact@v3
        with:
          path: privacy

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
